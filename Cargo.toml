[workspace]
members = ["crates/boilr-core"]
default-members = [".", "crates/boilr-core"]
exclude = ["apps/boilr-tauri"]

[workspace.dependencies]
base64 = "^0.22.1"
config = "^0.15.6"
dashmap = { version = "^6.1.0", features = ["serde"] }
eyre = "^0.6.12"
futures = "^0.3.31"
nom = "^8.0.0"
reqwest = { version = "^0.12.9", default-features = false, features = ["json", "rustls-tls"] }
# Pinned: 3.0.3 made WriteBatch::new() private (used by steam/collections.rs).
rusty-leveldb = "=3.0.0"
serde = { version = "^1.0.217", features = ["derive"] }
serde_json = "^1.0.132"
steam_shortcuts_util = "^1.1.8"
steamgriddb_api = "^0.3.1"
sysinfo = "^0.38.4"
time = { version = "^0.3.47", features = ["formatting"] }
tokio = { version = "^1.41.0", features = ["full"] }
toml = "^1.1.6"

[package]
edition = "2021"
name = "boilr"
version = "1.10.1"

[lib]
name = "boilr"
path = "src/lib.rs"

[[bin]]
name = "boilr"
path = "src/main.rs"
required-features = ["egui-ui"]

[dependencies]
boilr-core = { path = "crates/boilr-core" }
copypasta = { version = "^0.10.1", optional = true }
flate2 = "^1.0.34"
is_executable = "^1.0.4"
nom.workspace = true
serde_json.workspace = true
steam_shortcuts_util.workspace = true
steamgriddb_api.workspace = true
eyre.workspace = true
color-eyre = "^0.6.3"
dyn-clone = "^1.0.17"
time.workspace = true
egui_extras = { version = "0.29.1", features = ["all_loaders"], optional = true }
futures.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true

[dependencies.eframe]
version = "^0.29.1"
optional = true

[dependencies.egui]
version = "^0.29.1"
optional = true

[dependencies.image]
features = ["png","webp","jpeg"]
version ="^0.25.4"
optional = true

[target."cfg(windows)".build-dependencies]
winres = "^0.1.12"

[target."cfg(windows)".dependencies]
winreg = "^0.52.0"
sqlite = "^0.36.1"
roxmltree = "^0.20.0"

[target.'cfg(not(windows))'.dependencies]
wayland-cursor = "0.31.7"

[features]
default = ["egui-ui"]
# The egui desktop interface and the `boilr` binary. Other front ends (the Tauri app)
# depend on the library with default-features = false.
egui-ui = ["dep:copypasta", "dep:eframe", "dep:egui", "dep:egui_extras", "dep:image"]
# This feature is enabled when building for a flatpak environment
flatpak = []

#[profile.release]
#codegen-units = 1
#opt-level = "z"  # Optimize for size.
#lto = true
