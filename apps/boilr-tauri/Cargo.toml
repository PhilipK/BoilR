# A separate workspace for now, so Tauri's dependencies stay out of the root Cargo.lock and
# therefore out of the egui Flatpak's vendored sources.
[workspace]

[package]
name = "boilr-tauri"
version = "2.0.0-beta.2"
edition = "2021"

[dependencies]
boilr = { path = "../..", package = "boilr", default-features = false }
boilr-core = { path = "../../crates/boilr-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.1", features = ["wry", "protocol-asset"] }
tokio = { version = "1.41.0", features = ["rt-multi-thread"] }
steam_shortcuts_util = "1.1.9"
steamgriddb_api = "0.3.1"
time = "0.3"
toml = "0.9.8"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test", "wry"] }

[features]
# Launcher detection from inside the Flatpak sandbox (flatpak-spawn), as in the egui Flatpak.
flatpak = ["boilr/flatpak"]
