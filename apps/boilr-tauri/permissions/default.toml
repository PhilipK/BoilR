[default]
description = "Default permissions for BoilR commands"
permissions = ["allow-boilr-commands"]

[[permission]]
identifier = "allow-boilr-commands"
description = "Permits all application IPC commands"
commands.allow = [
  "load_settings",
  "discover_games",
  "plan_sync",
  "update_settings",
  "list_platform_settings",
  "update_platform_settings",
  "update_platform_enabled",
  "run_full_sync",
  "library:list_backups",
  "library:create_backup",
  "library:restore_shortcuts",
  "library:list_boilr_shortcuts",
  "library:release_shortcut",
  "artwork:list_steam_accounts",
  "artwork:list_artwork",
  "artwork:artwork_options",
  "artwork:set_artwork",
  "artwork:clear_artwork",
  "artwork:artwork_game_match",
  "artwork:set_artwork_game",
  "artwork:find_missing_artwork",
  "rename_game",
  "ping"
]
