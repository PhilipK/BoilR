# Test build of the Tauri app as a Flatpak. It uses its own app id so it installs next to the
# Flathub release of BoilR. Build from the repository root:
#
#   flatpak run org.flatpak.Builder --user --install-deps-from=flathub --force-clean \
#     --repo=.flatpak-repo .flatpak-build apps/boilr-tauri/flatpak/io.github.philipk.boilr.Devel.yml
#
# Builds offline, as Flathub requires: cargo and npm dependencies come from cargo-sources.json and
# node-sources.json. Regenerate both with update-sources.sh whenever Cargo.lock or
# package-lock.json changes (CI checks this).
app-id: io.github.philipk.boilr.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: boilr-tauri

# Same sandbox as the egui app on Flathub (flathub/io.github.philipk.boilr).
finish-args:
  - --filesystem=~/.config/legendary:ro # Legendary
  - --filesystem=~/.config/heroic # Heroic (native)
  - --filesystem=xdg-data/Steam:rw # Steam (Flatpak)
  - --filesystem=~/.steam:rw # Steam (native)
  - --filesystem=~/.var/app/com.valvesoftware.Steam:rw # Steam (Flatpak)
  - --filesystem=xdg-data/lutris:ro # Lutris (native)
  - --filesystem=~/.var/app/net.lutris.Lutris:ro # Lutris (Flatpak)
  - --filesystem=~/Games/Heroic:ro # Heroic (native)
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl:ro # Heroic (Flatpak)
  - --filesystem=~/.config/itch:ro # Itch (native)
  - --filesystem=~/GOG Games:ro # MiniGalaxy
  - --filesystem=/run/media:ro # Steam Deck SD card
  - --talk-name=org.freedesktop.Flatpak # Listing other Flatpaks
  - --filesystem=xdg-data/flatpak:ro # Listing other Flatpaks
  - --share=network # Artwork downloads
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=input # Controllers, for navigation in Steam Deck Game Mode

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/boilr/cargo
    CARGO_NET_OFFLINE: 'true'
    npm_config_cache: /run/build/boilr/flatpak-node/npm-cache
    npm_config_offline: 'true'

modules:
  - name: boilr
    buildsystem: simple
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - target-deck
          - .dockerhome
          - .flatpak-build
          - .flatpak-repo
          - .flatpak-builder
          - apps/boilr-tauri/node_modules
          - apps/boilr-tauri/target
          - apps/boilr-tauri/dist
      - cargo-sources.json
      - node-sources.json
    build-commands:
      - cd apps/boilr-tauri && npm ci --offline --no-audit --no-fund && npm run build
      - cd apps/boilr-tauri && cargo build --offline --release --features tauri/custom-protocol,flatpak
      - install -Dm755 apps/boilr-tauri/target/release/boilr-tauri /app/bin/boilr-tauri
      - install -Dm644 resources/256/io.github.philipk.boilr.png /app/share/icons/hicolor/256x256/apps/io.github.philipk.boilr.Devel.png
      - install -Dm644 resources/128/io.github.philipk.boilr.png /app/share/icons/hicolor/128x128/apps/io.github.philipk.boilr.Devel.png
      - install -Dm644 resources/64/io.github.philipk.boilr.png /app/share/icons/hicolor/64x64/apps/io.github.philipk.boilr.Devel.png
      - install -Dm644 apps/boilr-tauri/flatpak/io.github.philipk.boilr.Devel.desktop -t /app/share/applications/
