name: Flatpak lock sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  flatpak_lock_sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check flatpak/cargo-lock.json matches Cargo.lock
      run: python .github/scripts/check_flatpak_lock.py
